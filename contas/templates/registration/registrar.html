<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Registo - Gestão Financeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<div class="card p-4 shadow-sm" style="width: 400px;">
    <h3 class="text-center mb-3">📝 Nova Conta</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Criar Conta</button>
    </form>
    <hr>
    <p class="text-center mb-0">Já tem conta? <a href="{% url 'login' %}">Fazer Login</a></p>
</div>
</body>
</html>
